<!DOCTYPE html>
<html lang="en">
<head>

<title>Portfolio system map prototype</title>
<!-- Throwaway prototype: answers "does a procedural Outer Wilds-style map look good enough?"
     Single file, no build. The real site (Astro + content files) replaces this. -->
<style>
:root{--bg:#04060a;--ink:#e8e6dc;--dim:#9a988f;--line:#3a4152;--panel:rgba(10,14,20,.86);--green:#6fd68a;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:"Gill Sans","Gill Sans MT",Seravek,"Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#labels{position:fixed;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(14px,-50%);font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;pointer-events:auto;padding:6px 4px;text-shadow:0 0 6px #000,0 0 2px #000}
.lab.small{color:var(--dim);font-size:11px}
.lab:hover{color:#fff}
#brk{position:fixed;pointer-events:none;display:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;pointer-events:none;z-index:5}
#crumb{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:auto}
#crumb button{text-transform:uppercase;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px}
#toggle{display:flex;gap:6px;pointer-events:auto}
#toggle button{white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:rgba(4,6,10,.6)}
#toggle button[aria-pressed=true]{color:var(--ink);border-color:#b4b2a9}
#hints{position:fixed;right:18px;bottom:14px;text-align:right;color:var(--dim);font-size:14px;line-height:1.7;pointer-events:none}
#card{position:fixed;width:min(300px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:none;z-index:3}
#card h2,.entry h2{font:500 15px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
#card p{margin:0 0 8px;color:var(--dim);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.tags li{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:#fac775}
.btn{padding:6px 12px;border:1px solid #b4b2a9;border-radius:4px;font-size:14px}
.btn:hover{background:rgba(255,255,255,.08)}
#entry{position:fixed;left:18px;top:56px;bottom:18px;width:min(420px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:16px;overflow:auto;display:none;z-index:4}
.entry .shot{aspect-ratio:16/10;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--dim);font:12px var(--mono);margin-bottom:6px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px)}
.entry .dots{text-align:center;color:var(--dim);letter-spacing:.4em;margin-bottom:12px}
.entry dl{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;margin:10px 0 14px;font-size:14px}
.entry dt{color:var(--dim)} .entry dd{margin:0}
.entry h3{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 4px}
.entry p{margin:0 0 10px;font-size:14px}
.entry .todo{color:#f0997b}
.entry form{display:grid;gap:8px}
.entry input,.entry textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;padding:8px}
.x{float:right;color:var(--dim);font-size:14px;padding:2px 6px}
/* floating boxes in the 3D view borrow the ship-log look */
#card,#entry{background-color:rgba(7,17,28,.9);border:1px solid rgba(120,170,220,.45);border-radius:2px;
  background-image:linear-gradient(rgba(120,170,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,220,.07) 1px,transparent 1px);background-size:32px 32px}
#card h2,#entry h2{color:var(--green);font-size:17px;text-transform:none;letter-spacing:.06em;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid rgba(120,170,220,.35)}
#card .btn,#entry .btn{border-color:rgba(120,170,220,.6);border-radius:2px}
#card .tags li,#entry .tags li{border-color:rgba(120,170,220,.35);border-radius:2px}
/* log view: Outer Wilds ship log, Map Mode */
#log{position:fixed;inset:0;display:none;grid-template-columns:240px 1fr;grid-template-rows:auto 190px 1fr;gap:0;padding:56px 18px 18px;z-index:2;
  background:#07111c;background-image:linear-gradient(rgba(120,170,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,220,.07) 1px,transparent 1px);background-size:32px 32px}
#log h1{grid-column:1/3;font:500 22px var(--mono);letter-spacing:.06em;color:var(--green);margin:0 0 10px;padding:6px 10px;border:1px solid rgba(120,170,220,.35)}
#nav{grid-row:2/4;overflow:auto;border:1px solid rgba(120,170,220,.35);border-top:0;padding:8px 0}
#nav h2{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:10px 12px 2px}
#nav button{display:block;width:100%;text-align:left;padding:5px 12px;font-size:14px}
#nav button.moon{padding-left:28px;color:var(--dim)}
#nav button[aria-current=true]{background:rgba(111,214,138,.14);color:#fff}
#lineup{display:flex;align-items:center;gap:22px;overflow-x:auto;padding:0 18px;border:1px solid rgba(120,170,220,.35);border-top:0;border-left:0}
#lineup button{flex:none;border-radius:50%;border:2px solid transparent}
#lineup button[aria-current=true]{border-color:#bfe6ff;box-shadow:0 0 0 3px rgba(191,230,255,.25)}
#logentry{overflow:auto;padding:16px;border:1px solid rgba(120,170,220,.35);border-top:0;border-left:0}
#logentry .entry{max-width:900px;display:grid;grid-template-columns:minmax(180px,320px) minmax(0,1fr);gap:20px}
#logentry .entry>:only-child,#logentry .entry>form,#logentry .entry>h2,#logentry .entry>p{grid-column:1/3}
@media (max-width:700px){
  #log{grid-template-columns:1fr;grid-template-rows:auto 120px auto 1fr}
  #log h1{grid-column:1} #nav{grid-row:3;max-height:30vh;border-top:1px solid rgba(120,170,220,.35)} #lineup,#logentry{border-left:1px solid rgba(120,170,220,.35)}
  #hints{display:none}
  #logentry .entry{grid-template-columns:1fr}#logentry .entry>*{grid-column:1!important}
  #card{left:12px!important;top:auto!important;bottom:12px}
}
</style>
</head>

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);

 float rim=pow(1.-max(dot(N,V),0.),2.5);
 vec3 gc=T==2?vec3(1.,.8,.4):Bc;

const ATMO = `uniform vec3 C;varying vec3 vO;varying vec3 vW;varying vec3 vN;
void main(){vec3 V=normalize(cameraPosition-vW);float n=max(dot(vN,V),0.);float a=n<.5?pow(n*2.,2.5):mix(1.,.1,smoothstep(.5,.72,n));

const RING = `uniform vec3 C;varying vec3 vP;void main(){float t=(length(vP.xy)-1.4)/.9;float a=.2+.5*smoothstep(.3,.7,fract(t*4.+.2));
 a*=smoothstep(0.,.03,abs(t-.58)-.03)*smoothstep(0.,.06,t)*smoothstep(1.,.94,t);gl_FragColor=vec4(C,a);}`;
const SUN = NOISE+`uniform float t;varying vec3 vO;varying vec3 vW;varying vec3 vN;
void main(){float n=fbm(vO*3.+vec3(0.,t*.04,t*.02));float m=fbm(vO*9.-t*.03);vec3 V=normalize(cameraPosition-vW);
 vec3 col=mix(vec3(1.,.22,0.),vec3(1.,.62,.08),smoothstep(.35,.7,n));col=mix(col,vec3(1.,.9,.5),smoothstep(.62,.8,m)*.6);
 col*=.75+.45*pow(max(dot(vN,V),0.),.6);gl_FragColor=vec4(col,1.);}`;

const sphere = new THREE.SphereGeometry(1,48,32);
// stars
{const n=2600,pos=new Float32Array(n*3),col=new Float32Array(n*3);
 for(let i=0;i<n;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(1400);pos.set([v.x,v.y,v.z],i*3);const k=.35+Math.random()*.65,w=Math.random();col.set([k*(w>.9?1:.9),k*.92,k*(w<.1?1:.88)],i*3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true})));}
// sun
const sun = byId.contact; sun.r=3.2; sun.group=new THREE.Group(); scene.add(sun.group);
const sunMat=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:SUN,uniforms:{t:{value:0}}});
sun.mesh=new THREE.Mesh(sphere,sunMat); sun.mesh.scale.setScalar(sun.r); sun.mesh.userData.b=sun; sun.group.add(sun.mesh);
let glowTex;
{const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d'),g=x.createRadialGradient(128,128,20,128,128,128);
 g.addColorStop(0,'rgba(255,120,30,.8)');g.addColorStop(.45,'rgba(255,70,10,.22)');g.addColorStop(1,'rgba(255,40,0,0)');x.fillStyle=g;x.fillRect(0,0,256,256);
 glowTex=new THREE.CanvasTexture(cv);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.setScalar(sun.r*3.6);scene.add(s);}

const pick=[sun.mesh];
function planetMat(b,o={}){const pal=o.pal||b.pal;return new THREE.ShaderMaterial({vertexShader:PVERT,fragmentShader:PLANET,side:o.side||THREE.FrontSide,
  uniforms:{A:{value:rgb(pal[0])},Bc:{value:rgb(pal[1])},C:{value:rgb(pal[2])},T:{value:o.type??b.type},S:{value:b.seed},D:{value:o.D||0},F:{value:o.F||0}}});}
/* ---------- body shapes: each gives a different silhouette ---------- */
const SHAPES={linfox:'world','diverse-tech-lab':'world','wedding-suite':'giant','obs-chat':'twin','nominate-bot':'rugged',portfolio:'holo',roulette:'shattered',roguelike:'molten',wagent:'comet'};
const rock=new THREE.IcosahedronGeometry(1,3), UP=new THREE.Vector3(0,1,0);
const ghost=()=>new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}); // invisible, still clickable
function build(b){const s=b.shape;
  if(s==='rugged'||s==='comet')return new THREE.Mesh(rock,planetMat(b,{D:.24,F:1}));
  if(s==='molten')return new THREE.Mesh(rock,planetMat(b,{D:.1,F:1}));
  if(s==='twin'||s==='holo'||s==='shattered')return new THREE.Mesh(sphere,ghost());
  return new THREE.Mesh(sphere,planetMat(b));}
function decorate(b,R){const m=b.mesh,s=b.shape;
  if(s==='world'){const h=new THREE.Mesh(sphere,new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:ATMO,uniforms:{C:{value:rgb(0x7fc4ff)}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));h.scale.setScalar(1.16);m.add(h);}
  if(s==='giant'){m.scale.y*=.88;const rg=new THREE.Mesh(new THREE.RingGeometry(1.4,2.3,96),new THREE.ShaderMaterial({uniforms:{C:{value:rgb(b.pal[1])}},transparent:true,depthWrite:false,side:THREE.DoubleSide,
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:RING}));rg.rotation.x=Math.PI/2;m.add(rg);}
  if(s==='crystal'){const n=30,im=new THREE.InstancedMesh(new THREE.ConeGeometry(.16,1,5),planetMat(b,{F:1}),n),d=new THREE.Object3D();
    for(let i=0;i<n;i++){const dir=new THREE.Vector3(R()-.5,R()-.5,R()-.5).normalize(),h=.5+R()*.9;d.position.copy(dir).multiplyScalar(.85+h/2);d.quaternion.setFromUnitVectors(UP,dir);d.scale.set(.7+R()*.8,h,.7+R()*.8);d.updateMatrix();im.setMatrixAt(i,d.matrix);}
    m.add(im);}
  if(s==='twin'){b.spin=.5;[[-.8,b.pal],[.8,[0xb0522a,0xf0c090,0x5a2416]]].forEach(([x,pal])=>{const t=new THREE.Mesh(sphere,planetMat(b,{pal}));t.position.x=x;t.scale.setScalar(.6);m.add(t);});}
  if(s==='holo'){b.spin=.3;const mk=(g,c,o)=>new THREE.LineSegments(new THREE.WireframeGeometry(g),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o}));
    m.add(mk(new THREE.IcosahedronGeometry(1,1),0x7fe0ff,.9),mk(new THREE.OctahedronGeometry(.5,0),0xffffff,.75));}
  if(s==='shattered'){b.spin=.08;const ico=new THREE.IcosahedronGeometry(1,1).attributes.position,pts=[],v3=i=>new THREE.Vector3().fromBufferAttribute(ico,i);
    for(let i=0;i<ico.count;i+=3){if(R()<.22)continue;const t=[v3(i),v3(i+1),v3(i+2)],c=t[0].clone().add(t[1]).add(t[2]).divideScalar(3),k=1+R()*.16;
      const o=t.map(p=>p.lerp(c,.14).multiplyScalar(k));pts.push(...o,...o.map(p=>p.clone().multiplyScalar(.86)).reverse());}
    m.add(new THREE.Mesh(new THREE.BufferGeometry().setFromPoints(pts),planetMat(b,{F:1,side:THREE.DoubleSide,type:0,pal:[0x3a2a26,0x70504a,0x1a1210]})));
    const core=new THREE.Mesh(sphere,new THREE.MeshBasicMaterial({color:0xff6a1a}));core.scale.setScalar(.48);m.add(core);
    const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false}));g.scale.setScalar(2.6);m.add(g);}
  if(s==='comet'){const g=new THREE.ConeGeometry(.9,9,20,1,true);g.rotateX(Math.PI);g.translate(0,4.5,0);
    b.tail=new THREE.Mesh(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
      vertexShader:`varying float h;void main(){h=position.y/9.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`varying float h;void main(){gl_FragColor=vec4(.6,.85,1.,pow(1.-h,2.5)*.2);}`}));b.tail.scale.setScalar(b.r);b.group.add(b.tail);}
}
function orbitLine(r,color,op,seg=256){const pts=[];for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));}
// deterministic pseudo-random from the id: same data, same system
const rnd = s => {let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>((h=Math.imul(h^h>>>15,2246822507)^Math.imul(h^h>>>13,3266489909))>>>0)/4294967296;};

const planets=B.filter(b=>!b.parent&&b.lane!=='sun'&&b.lane!=='belt');
planets.forEach((b,i)=>{
  const R=rnd(b.id); b.seed=R()*50; b.r=[.55,.95,1.4][b.size-1]; b.a=10+i*3.4; b.ang=R()*Math.PI*2; b.speed=.9/Math.pow(b.a,1.5);
  const tint=new THREE.Color(LANES[b.lane].tint).offsetHSL((R()-.5)*.06,0,(R()-.5)*.1);
  scene.add(orbitLine(b.a,tint,.55));
  b.group=new THREE.Group(); scene.add(b.group);
  b.shape=SHAPES[b.id]; b.mesh=build(b); b.mesh.scale.setScalar(b.r); b.mesh.rotation.z=(R()-.5)*.6; b.mesh.userData.b=b; b.group.add(b.mesh); pick.push(b.mesh); decorate(b,R);
  (b.moons||[]).forEach((m,j)=>{m.r=b.r*.22;m.a=b.r*(2.4+j*.7);m.ang=R()*6.28;m.speed=.25/(j+1);m.seed=R()*50;m.type=0;m.pal=[0x777570,0xb4b2a9,0x444441];
    b.group.add(orbitLine(m.a,0xffffff,.18,96));
    m.mesh=new THREE.Mesh(sphere,planetMat(m));m.mesh.scale.setScalar(m.r);m.mesh.userData.b=m;b.group.add(m.mesh);pick.push(m.mesh);});
});
// asteroid belt
const beltR=10+planets.length*3.4+4, belt=new THREE.Group(); scene.add(belt);
{const n=420,im=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshBasicMaterial(),n),d=new THREE.Object3D(),R=rnd('belt'),c=new THREE.Color();
 for(let i=0;i<n;i++){const a=R()*6.283,r=beltR+(R()-.5)*4;d.position.set(Math.cos(a)*r,(R()-.5)*.8,Math.sin(a)*r);d.rotation.set(R()*6,R()*6,R()*6);d.scale.setScalar(.05+R()*.14);d.updateMatrix();im.setMatrixAt(i,d.matrix);
  im.setColorAt(i,c.setScalar(.22+R()*.3));}
 belt.add(im);}
B.filter(b=>b.lane==='belt').forEach((b,i,all)=>{const R=rnd(b.id);b.seed=R()*50;b.r=.34;b.type=0;b.pal=[0x5f5e5a,0x9a988f,0x2c2c2a];b.ang=i/all.length*6.283+.6;b.a=beltR+(R()-.5)*2;
  b.group=new THREE.Group();b.group.position.set(Math.cos(b.ang)*b.a,0,Math.sin(b.ang)*b.a);belt.add(b.group);
  b.mesh=new THREE.Mesh(rock,planetMat(b,{D:.35,F:1}));b.mesh.scale.set(b.r,b.r*.75,b.r*.85);b.mesh.userData.b=b;b.group.add(b.mesh);pick.push(b.mesh);});
// focus grid
const grid=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{o:{value:0}},
  vertexShader:`varying vec2 u;void main(){u=uv-.5;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 u;uniform float o;void main(){vec2 g=abs(fract(u*36.)-.5);vec2 w=fwidth(u*36.);float l=1.-min(smoothstep(0.,w.x*1.5,g.x),smoothstep(0.,w.y*1.5,g.y));
   float f=smoothstep(.5,.12,length(u));gl_FragColor=vec4(.75,.85,.9,l*f*.3*o);}`}));
grid.rotation.x=-Math.PI/2; scene.add(grid);

/* ---------- labels ---------- */
const labels=document.getElementById('labels');
for(const b of B){const el=document.createElement('button');el.className='lab'+(b.parent||b.lane==='belt'?' small':'');el.textContent=b.short||b.name;el.onclick=()=>select(b.id);labels.append(el);b.label=el;}

/* ---------- state, camera, input ---------- */
let sel=null, open=false, view='3d';
const cam={yaw:.9,pitch:.5,dist:95,gDist:95,target:new THREE.Vector3()};
const SYS=95, wp=new THREE.Vector3(), v=new THREE.Vector3();
const focusDist=b=>b.lane==='sun'?b.r*6:b.parent?b.r*14:b.lane==='belt'?b.r*16:b.r*(b.moons?9:7);
function select(id,fromHash){
  sel=id&&byId[id]?byId[id]:null; open=false; cam.gDist=(sel?focusDist(sel):SYS)*Math.max(1,1.15/camera.aspect);
  if(!fromHash){try{history.replaceState(null,'',sel?'#'+sel.id:location.pathname+location.search)}catch(e){location.hash=sel?sel.id:''}}
  render();
}
const $=id=>document.getElementById(id);
function render(){
  const lane=sel&&LANES[sel.lane].name, par=sel&&sel.parent&&byId[sel.parent];
  $('crumb').innerHTML=sel?`<button data-go="">System</button> / ${lane}${par?` / <button data-go="${par.id}">${par.name}</button>`:''} / ${sel.name}`:'System';
  $('t3d').setAttribute('aria-pressed',view==='3d');$('tlog').setAttribute('aria-pressed',view==='log');
  const is3d=view==='3d';
  $('log').style.display=is3d?'none':'grid';labels.style.display=is3d?'':'none';$('hints').style.visibility=is3d?'':'hidden';
  $('card').style.display=is3d&&sel&&!open?'block':'none';$('entry').style.display=is3d&&sel&&open?'block':'none';
  if(sel){$('card').innerHTML=`<h2>${sel.name}</h2><p>${sel.what}</p>${sel.when?`<p>${sel.when}${sel.part?' · '+sel.part:''}</p>`:''}
     ${sel.stack.length?`<ul class="tags">${sel.stack.slice(0,5).map(s=>`<li>${s}</li>`).join('')}</ul>`:''}<button class="btn" data-open>${sel.lane==='sun'?'Open contact form':'Open entry'}</button>`;
    $('entry').innerHTML=entryHTML(sel,true);}
  if(!is3d){const cur=sel||sun;$('logtitle').textContent=cur.name;
    $('nav').innerHTML=Object.entries(LANES).map(([k,l])=>`<h2>${l.name}</h2>`+B.filter(b=>b.lane===k&&!b.parent).map(b=>
      `<button data-go="${b.id}" aria-current="${cur===b}">${b.name}</button>`+(b.moons||[]).map(m=>`<button class="moon" data-go="${m.id}" aria-current="${cur===m}">${m.name}</button>`).join('')).join('')).join('');
    const hex=h=>'#'+h.toString(16).padStart(6,'0');
    $('lineup').innerHTML=B.filter(b=>!b.parent).map(b=>{const s=b.lane==='sun'?110:b.lane==='belt'?12:[26,40,58][b.size-1],c=b.lane==='sun'?'radial-gradient(#ffb020,#ff3a00)':`radial-gradient(circle at 35% 30%,${hex(b.pal[1])},${hex(b.pal[0])})`;
      return `<button data-go="${b.id}" aria-label="${b.name}" aria-current="${cur===b||cur.parent===b.id}" style="width:${s}px;height:${s}px;background:${c}"></button>`}).join('');
    $('logentry').innerHTML=`<div class="entry">${entryHTML(cur,false)}</div>`;}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-open],[data-close]');if(!t)return;
  if(t.dataset.go!==undefined)select(t.dataset.go||null);else if('open' in t.dataset){open=true;render();$('entry').querySelector('button').focus();}else{open=false;render();}});
document.addEventListener('submit',e=>{e.preventDefault();const s=e.target.querySelector('[data-status]');if(s)s.textContent='Prototype only: nothing was sent.';});
$('t3d').onclick=()=>{view='3d';render()};$('tlog').onclick=()=>{view='log';render()};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(open){open=false;render()}else if(sel)select(sel.parent||null)});
addEventListener('hashchange',()=>select(location.hash.slice(1)||null,true));

const ptrs=new Map();let moved=0,pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);moved=0;pinch=0});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){cam.yaw+=(e.clientX-p.clientX)*.005;cam.pitch=Math.min(1.45,Math.max(.06,cam.pitch+(e.clientY-p.clientY)*.004));moved+=Math.abs(e.clientX-p.clientX)+Math.abs(e.clientY-p.clientY);}
  ptrs.set(e.pointerId,e);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoom(pinch/d);pinch=d;moved=99;}});
const up=e=>{if(ptrs.delete(e.pointerId)&&moved<5&&e.type==='pointerup'){const r=canvas.getBoundingClientRect();
  v.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1,0);const rc=new THREE.Raycaster();rc.setFromCamera(v,camera);const h=rc.intersectObjects(pick)[0];if(h)select(h.object.userData.b.id);}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function zoom(f){cam.gDist=Math.min(260,Math.max(sel?sel.r*2.6:14,cam.gDist*f));}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0012))},{passive:false});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
let last=performance.now(),gridO=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(view==='3d'){
    const drift=reduced?0:dt; sunMat.uniforms.t.value+=drift;
    for(const b of planets){b.ang+=b.speed*drift*.35;b.group.position.set(Math.cos(b.ang)*b.a,0,Math.sin(b.ang)*b.a);b.mesh.rotation.y+=drift*(b.spin||.05);if(b.tail)b.tail.quaternion.setFromUnitVectors(UP,v.copy(b.group.position).normalize());
      for(const m of b.moons||[]){m.ang+=m.speed*drift;m.mesh.position.set(Math.cos(m.ang)*m.a,0,Math.sin(m.ang)*m.a);}}
    belt.rotation.y-=drift*.0012;
    const k=reduced?1:1-Math.exp(-dt*4.5);
    if(sel)sel.mesh.getWorldPosition(wp);else wp.set(0,0,0);
    cam.target.lerp(wp,k);cam.dist+=(cam.gDist-cam.dist)*k;
    camera.position.set(Math.cos(cam.pitch)*Math.sin(cam.yaw),Math.sin(cam.pitch),Math.cos(cam.pitch)*Math.cos(cam.yaw)).multiplyScalar(cam.dist).add(cam.target);
    camera.lookAt(cam.target);camera.updateMatrixWorld();
    const showGrid=sel&&sel.lane!=='sun';gridO+=((showGrid?1:0)-gridO)*k;grid.material.uniforms.o.value=gridO;
    if(showGrid){const s=sel.r*26;grid.scale.setScalar(s);grid.position.copy(wp).setY(-sel.r*1.25);}
    renderer.render(scene,camera);
    // labels, brackets, card
    const W=innerWidth,H=innerHeight,f=H/2/Math.tan(camera.fov*Math.PI/360);
    for(const b of B){b.mesh.getWorldPosition(v);const d=v.distanceTo(camera.position);v.project(camera);
      const x=(v.x+1)/2*W,y=(1-v.y)/2*H,pr=b.r*f/d;b.sx=x;b.sy=y;b.pr=pr;
      const vis=v.z<1&&(!b.parent||(sel&&(sel.id===b.parent||sel.parent===b.parent)))&&!(open&&x<460)&&!(y<56&&x>W-260)&&(b.lane!=='belt'||cam.dist<SYS*1.6);
      b.label.style.display=vis?'':'none';if(vis)b.label.style.transform=`translate(${x+Math.max(8,pr+6)}px,${y}px) translate(0,-50%)`;}
    const brk=$('brk');
    if(sel){const s=Math.max(54,sel.pr*2.7);brk.style.display='block';brk.style.width=brk.style.height=s+'px';brk.style.left=sel.sx-s/2+'px';brk.style.top=sel.sy-s/2+'px';
      const c=$('card');if(c.style.display==='block'&&W>700){c.style.left=Math.min(W-c.offsetWidth-12,sel.sx+s/2+18)+'px';c.style.top=Math.max(60,Math.min(H-c.offsetHeight-12,sel.sy-40))+'px';}
      sel.label.style.display='none';
    }else brk.style.display='none';
  }
  requestAnimationFrame(frame);
}
labels.querySelectorAll('.lab').forEach(l=>l.style.left=l.style.top='0');
select(location.hash.slice(1)||null,true);
requestAnimationFrame(frame);
window.__ready=true;
</script>
