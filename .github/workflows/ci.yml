name: CI
on:
  push:
    branches: [main, site]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build validates every entry against the schema in src/content.config.ts.
      - run: npm run build
